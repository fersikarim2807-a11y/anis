<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Anis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .banniere {
      width: 100%;
      max-width: 900px;
      padding: 80px 24px;
      border-radius: 24px;
      background: linear-gradient(120deg, #1d4ed8, #6d28d9);
      color: white;
      text-align: center;
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.18);
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 72px);
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <main class="banniere">
    <h1>Bonjour Anis</h1>
  </main>
</body>
</html>
